<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prompt 点酒 | AGI Bar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="mark">AGI</div>
        <div>
          <p class="brand-title">AGI Bar // WAIC</p>
          <p class="brand-sub" data-i18n="tagline">值得一见的人，总在 AGI Bar</p>
        </div>
      </div>
      <div class="lang" aria-label="Language">
        <button type="button" class="active" data-lang="zh">中</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </header>

    <main class="prompt-main">
      <section aria-labelledby="page-title">
        <h1 id="page-title" class="headline zh" data-i18n="headline">Prompt 点酒</h1>
        <p class="intro" data-i18n="intro">说一句、打一句，或点几个关键词，生成你的 WAIC 专属酒。端起酒杯，卸下防御，真实的社交才真正开始。</p>
      </section>

      <section class="prompt-card" aria-label="Prompt order">
        <div class="terminal-line">
          <span><b>agibar@waic</b> ~ % cat your_mood</span>
          <span data-i18n="terminal">一句话输入</span>
        </div>

        <div class="input-wrap">
          <textarea id="prompt" data-i18n-placeholder="placeholder" placeholder="比如：刚从 WAIC 出来，想喝一杯清爽、有上海感、适合聊天的酒。"></textarea>
          <button type="button" class="mic" id="mic" aria-label="语音输入" title="语音输入">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z"></path>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
              <path d="M12 19v3"></path>
            </svg>
          </button>
        </div>
        <div class="status" id="status" aria-live="polite"></div>

        <div class="groups" id="groups"></div>

        <div class="actions">
          <button class="primary" type="button" id="generate" data-i18n="generate">生成我的酒</button>
          <button class="secondary" type="button" id="clear" data-i18n="clear">清空</button>
        </div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app-data.js"></script>
  <script>
    const data = window.AGIBarData;
    let draft = data.loadDraft();
    const selected = new Set(draft.selected || []);
    let recognition = null;

    const $ = (selector) => document.querySelector(selector);
    const promptEl = $("#prompt");
    const groupsEl = $("#groups");
    const statusEl = $("#status");
    const toastEl = $("#toast");

    function t(key) {
      return data.copy[draft.lang || "zh"][key];
    }

    function persist() {
      draft.prompt = promptEl.value;
      draft.selected = Array.from(selected);
      data.saveDraft(draft);
    }

    function renderGroups() {
      groupsEl.innerHTML = data.groups.map((group) => `
        <section class="group">
          <h2>${t(group.title)}</h2>
          <div class="chips">
            ${group.options.map(([value, zh, en]) => `
              <button type="button" class="chip ${selected.has(value) ? "selected" : ""}" data-chip="${value}">
                ${draft.lang === "zh" ? zh : en}
              </button>
            `).join("")}
          </div>
        </section>
      `).join("");
    }

    function renderCopy() {
      const lang = draft.lang || "zh";
      document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
      document.title = lang === "zh" ? "Prompt 点酒 | AGI Bar" : "Prompt Your Pour | AGI Bar";
      document.querySelectorAll("[data-i18n]").forEach((node) => {
        node.textContent = t(node.dataset.i18n);
      });
      document.querySelectorAll("[data-i18n-placeholder]").forEach((node) => {
        node.placeholder = t(node.dataset.i18nPlaceholder);
      });
      document.querySelectorAll("[data-lang]").forEach((button) => {
        button.classList.toggle("active", button.dataset.lang === lang);
      });
      $("#page-title").classList.toggle("zh", lang === "zh");
      $("#mic").setAttribute("aria-label", lang === "zh" ? "语音输入" : "Voice input");
      $("#mic").title = lang === "zh" ? "语音输入" : "Voice input";
      renderGroups();
    }

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.style.color = isError ? "var(--red)" : "var(--cyan)";
    }

    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add("show");
      window.setTimeout(() => toastEl.classList.remove("show"), 1600);
    }

    function generate() {
      const prompt = promptEl.value.trim();
      if (!prompt && selected.size === 0) {
        setStatus(t("needInput"), true);
        return;
      }
      draft.prompt = promptEl.value;
      draft.selected = Array.from(selected);
      const drink = data.chooseDrink(draft);
      draft.currentDrinkId = drink.id;
      draft.lastDrinkId = drink.id;
      data.saveDraft(draft);
      window.location.href = "order.html";
    }

    function setupSpeech() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        $("#mic").classList.add("hidden");
        return;
      }

      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.onstart = () => {
        $("#mic").classList.add("listening");
        setStatus(t("listening"));
      };
      recognition.onend = () => $("#mic").classList.remove("listening");
      recognition.onerror = () => {
        $("#mic").classList.remove("listening");
        setStatus(t("speechError"), true);
      };
      recognition.onresult = (event) => {
        const transcript = Array.from(event.results).map((result) => result[0].transcript).join(" ").trim();
        promptEl.value = promptEl.value ? `${promptEl.value} ${transcript}` : transcript;
        setStatus("");
        persist();
      };
    }

    document.addEventListener("click", (event) => {
      const chip = event.target.closest("[data-chip]");
      if (!chip) return;
      const value = chip.dataset.chip;
      if (selected.has(value)) selected.delete(value);
      else selected.add(value);
      renderGroups();
      persist();
    });

    document.querySelectorAll("[data-lang]").forEach((button) => {
      button.addEventListener("click", () => {
        draft.lang = button.dataset.lang;
        renderCopy();
        persist();
      });
    });

    $("#generate").addEventListener("click", generate);
    $("#clear").addEventListener("click", () => {
      selected.clear();
      promptEl.value = "";
      draft = { prompt: "", selected: [], lang: draft.lang || "zh", currentDrinkId: null, lastDrinkId: null };
      data.saveDraft(draft);
      setStatus("");
      renderCopy();
      showToast(t("clearSaved"));
    });
    promptEl.addEventListener("input", persist);
    $("#mic").addEventListener("click", () => {
      if (!recognition) {
        setStatus(t("speechUnsupported"), true);
        return;
      }
      recognition.lang = draft.lang === "zh" ? "zh-CN" : "en-US";
      recognition.start();
    });

    promptEl.value = draft.prompt || "";
    setupSpeech();
    renderCopy();
  </script>
</body>
</html>
