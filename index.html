<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>prompt-order | AGI Bar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="mark">AGI</div>
        <div>
          <p class="brand-title">AGI Bar // 0829</p>
          <p class="brand-sub" data-i18n="tagline">值得一见的人，总在 AGI Bar</p>
        </div>
      </div>
      <div class="lang" aria-label="Language">
        <button type="button" class="active" data-lang="zh">中</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </header>

    <main class="prompt-main">
      <section aria-labelledby="page-title">
        <h1 id="page-title" class="headline zh" data-i18n="headline">prompt-order</h1>
        <p class="intro" data-i18n="intro">看不懂菜单也没关系。写一句，或点几个关键词，生成今晚的点单；也可以进配方实验室，调一杯自己的版本。</p>
        <div class="mode-tabs" aria-label="Mode">
          <button type="button" class="active" data-mode="order" data-i18n="tabOrder">点单</button>
          <button type="button" data-mode="lab" data-i18n="tabLab">配方实验室</button>
        </div>
      </section>

      <section class="prompt-card mode-panel active" id="orderPanel" aria-label="Prompt order">
        <div class="terminal-line">
          <span><b>agibar@prompt-order</b> ~ % cat your_mood</span>
          <span data-i18n="terminal">一句话输入</span>
        </div>

        <div class="input-wrap">
          <textarea id="prompt" data-i18n-placeholder="placeholder" placeholder="比如：刚到现场，想要一杯清爽、适合聊天、不要太重的。"></textarea>
        </div>
        <div class="status" id="status" aria-live="polite"></div>

        <div class="groups" id="groups"></div>

        <div class="actions">
          <button class="primary" type="button" id="generate" data-i18n="generate">生成我的点单</button>
          <button class="secondary" type="button" id="clear" data-i18n="clear">清空</button>
        </div>
      </section>

      <section class="prompt-card lab-panel mode-panel" id="labPanel" aria-label="Recipe lab">
        <div class="terminal-line">
          <span><b>agibar@0829</b> ~ % ./recipe_lab</span>
          <span data-i18n="labTerminal">选择一款</span>
        </div>
        <div class="lab-head">
          <h2 data-i18n="labHeadline">配方实验室</h2>
          <p data-i18n="labIntro">三款活动限定特调先不命名。先看口味和配方，三款都是无醇；想要含醇可自行 DIY。</p>
        </div>
        <div class="mix-list" id="mixList"></div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <section class="assistant-modal" id="assistantModal" aria-hidden="true" hidden>
    <button class="assistant-backdrop" type="button" data-assistant-close aria-label="关闭"></button>
    <div class="assistant-sheet" role="dialog" aria-modal="true" aria-labelledby="assistantTitle">
      <header class="assistant-head">
        <h2 id="assistantTitle" data-i18n="assistantTitle">AI 配方助手</h2>
        <button class="assistant-close" type="button" data-assistant-close aria-label="关闭">×</button>
      </header>
      <p class="assistant-intro" data-i18n="assistantIntro">说一句你想怎么调整，我给你一份当前配方参考。</p>
      <div class="assistant-quick" id="assistantQuick"></div>
      <form id="assistantForm">
        <textarea id="assistantPrompt" rows="3" data-i18n-placeholder="assistantPlaceholder" placeholder="比如：少甜一点，气泡更足。"></textarea>
        <p class="assistant-status" id="assistantStatus" role="status" aria-live="polite"></p>
        <button class="primary" type="submit" id="assistantGenerate" data-i18n="assistantGenerate">生成配方参考</button>
      </form>
      <div class="assistant-result" id="assistantResult" hidden></div>
      <p class="assistant-disclaimer" data-i18n="assistantDisclaimer">仅供现场调整参考，实际以现有原料为准。</p>
    </div>
  </section>

  <script src="app-data.js"></script>
  <script>
    const data = window.AGIBarData;
    let draft = data.loadDraft();
    const selected = new Set(draft.selected || []);

    const $ = (selector) => document.querySelector(selector);
    const promptEl = $("#prompt");
    const groupsEl = $("#groups");
    const statusEl = $("#status");
    const toastEl = $("#toast");
    const mixListEl = $("#mixList");
    const assistantModalEl = $("#assistantModal");
    const assistantPromptEl = $("#assistantPrompt");
    const assistantStatusEl = $("#assistantStatus");
    const assistantResultEl = $("#assistantResult");
    const assistantGenerateEl = $("#assistantGenerate");
    const assistantStorageKey = "agibar_recipe_assistant_v1";
    const journeyStorageKey = "agibar_recipe_journey_v1";
    let assistantDrafts = loadAssistantDrafts();
    let activeAssistantMixId = "";
    let journey = loadJourney();
    const imageCache = new Map();
    const previewUrls = new Map();
    const params = new URLSearchParams(window.location.search);
    const requestedMix = (params.get("mix") || "").toUpperCase();
    const requestedMixIsValid = data.eventMixes.some((mix) => mix.id === requestedMix);
    const savedMixIsValid = data.eventMixes.some((mix) => mix.id === journey.activeMixId);
    let selectedMixId = journey.updatedAt && savedMixIsValid
      ? journey.activeMixId
      : requestedMixIsValid ? requestedMix : savedMixIsValid ? journey.activeMixId : data.eventMixes[0].id;
    let mode = params.get("tab") === "lab" || requestedMixIsValid ? "lab" : "order";

    function t(key) {
      return data.copy[draft.lang || "zh"][key];
    }

    function persist() {
      draft.prompt = promptEl.value;
      draft.selected = Array.from(selected);
      data.saveDraft(draft);
    }

    function loadAssistantDrafts() {
      try {
        return JSON.parse(localStorage.getItem(assistantStorageKey) || "{}") || {};
      } catch {
        localStorage.removeItem(assistantStorageKey);
        return {};
      }
    }

    function saveAssistantDrafts() {
      localStorage.setItem(assistantStorageKey, JSON.stringify(assistantDrafts));
    }

    function createClientId() {
      if (window.crypto?.randomUUID) return window.crypto.randomUUID();
      return `guest-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function loadJourney() {
      try {
        const stored = JSON.parse(localStorage.getItem(journeyStorageKey) || "null");
        if (stored?.clientId) return { ...stored, mixes: stored.mixes || {} };
      } catch {
        localStorage.removeItem(journeyStorageKey);
      }
      return { clientId: createClientId(), activeMixId: "", mixes: {}, updatedAt: "" };
    }

    function saveJourney() {
      journey.updatedAt = new Date().toISOString();
      localStorage.setItem(journeyStorageKey, JSON.stringify(journey));
    }

    function getMixProgress(mixId) {
      if (!journey.mixes[mixId]) {
        journey.mixes[mixId] = {
          note: "",
          hasImage: false,
          submitted: false,
          submissionId: "",
          submittedAt: ""
        };
      }
      return journey.mixes[mixId];
    }

    function openJourneyDatabase() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) {
          reject(new Error("IndexedDB unavailable"));
          return;
        }
        const request = window.indexedDB.open("agibar_recipe_journey", 1);
        request.onupgradeneeded = () => {
          if (!request.result.objectStoreNames.contains("images")) {
            request.result.createObjectStore("images");
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    function imageStorageKey(mixId) {
      return `${journey.clientId}:${mixId}`;
    }

    async function saveJourneyImage(mixId, blob) {
      imageCache.set(mixId, blob);
      const database = await openJourneyDatabase();
      await new Promise((resolve, reject) => {
        const transaction = database.transaction("images", "readwrite");
        transaction.objectStore("images").put(blob, imageStorageKey(mixId));
        transaction.oncomplete = resolve;
        transaction.onerror = () => reject(transaction.error);
      });
      database.close();
    }

    async function loadJourneyImage(mixId) {
      if (imageCache.has(mixId)) return imageCache.get(mixId);
      const database = await openJourneyDatabase();
      const blob = await new Promise((resolve, reject) => {
        const transaction = database.transaction("images", "readonly");
        const request = transaction.objectStore("images").get(imageStorageKey(mixId));
        request.onsuccess = () => resolve(request.result || null);
        request.onerror = () => reject(request.error);
      });
      database.close();
      if (blob) imageCache.set(mixId, blob);
      return blob;
    }

    function renderGroups() {
      groupsEl.innerHTML = data.groups.map((group) => `
        <section class="group">
          <h2>${t(group.title)}</h2>
          <div class="chips">
            ${group.options.map(([value, zh, en]) => `
              <button type="button" class="chip ${selected.has(value) ? "selected" : ""}" data-chip="${value}">
                ${draft.lang === "zh" ? zh : en}
              </button>
            `).join("")}
          </div>
        </section>
      `).join("");
    }

    function renderLab() {
      const lang = draft.lang || "zh";
      const mix = data.eventMixes.find((item) => item.id === selectedMixId) || data.eventMixes[0];
      const formula = mix.formulas.zero[lang];
      const flavors = lang === "zh" ? mix.flavorZh : mix.flavorEn;
      const hint = lang === "zh" ? mix.hintZh : mix.hintEn;
      const color = lang === "zh" ? mix.colorZh : mix.colorEn;
      const diyNote = lang === "zh" ? mix.diyZh : mix.diyEn;
      const progress = getMixProgress(mix.id);

      mixListEl.innerHTML = `
        <div class="mix-switcher">
          <p class="field-label">${t("mixChoose")}</p>
          <div class="mix-switch" role="tablist" aria-label="${t("mixChoose")}">
            ${data.eventMixes.map((item) => `
              <button type="button" role="tab" aria-selected="${item.id === mix.id}" class="${item.id === mix.id ? "active" : ""}" data-mix-switch="${item.id}">${item.id}</button>
            `).join("")}
          </div>
        </div>
        <article class="mix-card" data-mix="${mix.id}">
          <div class="mix-hero">
            <figure class="mix-visual mix-visual-${mix.id.toLowerCase()}">
              <img src="${mix.image}" alt="${color}">
            </figure>
            <div class="mix-summary">
              <p class="mix-hint">${hint}</p>
              <div class="mix-pills">
                <span class="pill">${color}</span>
                ${flavors.map((item) => `<span class="pill">${item}</span>`).join("")}
              </div>
            </div>
          </div>
          <div class="lab-fields">
            <div>
              <p class="field-label">${t("labFormula")}</p>
              <ul>${formula.map((item) => `<li>${item}</li>`).join("")}</ul>
            </div>
            <div>
              <p class="field-label">${t("labDiy")}</p>
              <p>${diyNote}</p>
            </div>
          </div>
          <div class="assistant-entry">
            <button class="assistant-launch" type="button" data-assistant-open="${mix.id}">
              <span class="assistant-badge">AI</span>
              <span>${t("assistantOpen")}</span>
            </button>
          </div>
          <section class="diy-share" aria-labelledby="diyTitle-${mix.id}">
            <div class="diy-share-head">
              <div>
                <h4 id="diyTitle-${mix.id}">${t("diyUploadTitle")}</h4>
                <p>${t("diyUploadIntro")}</p>
              </div>
            </div>
            <div class="diy-photo-empty" data-diy-empty>
              <label class="diy-photo-button">
                <span>${t("diyChoosePhoto")}</span>
                <input type="file" accept="image/jpeg,image/png,image/webp" capture="environment" data-diy-photo="${mix.id}">
              </label>
            </div>
            <div class="diy-preview" data-diy-preview hidden>
              <img alt="${t("diyPhotoAlt")}" data-diy-preview-image>
              <label class="diy-photo-button secondary-upload">
                <span>${t("diyReplacePhoto")}</span>
                <input type="file" accept="image/jpeg,image/png,image/webp" capture="environment" data-diy-photo="${mix.id}">
              </label>
            </div>
            <label class="diy-note-label">
              <span>${t("diyNoteLabel")}</span>
              <textarea rows="3" data-diy-note="${mix.id}" placeholder="${t("diyNotePlaceholder")}"></textarea>
            </label>
            <p class="diy-status ${progress.submitted ? "success" : ""}" data-diy-status role="status" aria-live="polite"></p>
            <button class="primary diy-submit" type="button" data-diy-submit="${mix.id}">${t("diySubmit")}</button>
          </section>
        </article>
      `;

      hydrateMixProgress(mix.id);
    }

    function setActiveMix(mixId) {
      if (!data.eventMixes.some((mix) => mix.id === mixId)) return;
      selectedMixId = mixId;
      journey.activeMixId = mixId;
      saveJourney();
      const nextUrl = new URL(window.location.href);
      nextUrl.searchParams.set("tab", "lab");
      nextUrl.searchParams.set("mix", mixId);
      window.history.replaceState(null, "", nextUrl);
      renderLab();
    }

    function setDiyStatus(card, message, type = "") {
      const status = card?.querySelector("[data-diy-status]");
      if (!status) return;
      status.textContent = message;
      status.classList.toggle("error", type === "error");
      status.classList.toggle("success", type === "success");
    }

    async function hydrateMixProgress(mixId) {
      const card = mixListEl.querySelector(`[data-mix="${mixId}"]`);
      if (!card) return;
      const progress = getMixProgress(mixId);
      const note = card.querySelector("[data-diy-note]");
      note.value = progress.note || "";
      if (progress.submitted) setDiyStatus(card, t("diySubmitted"), "success");
      else if (progress.hasImage || progress.note) setDiyStatus(card, t("diySavedLocal"));

      let blob = null;
      try {
        blob = await loadJourneyImage(mixId);
      } catch {
        blob = imageCache.get(mixId) || null;
      }
      if (!blob || !mixListEl.querySelector(`[data-mix="${mixId}"]`)) return;

      if (previewUrls.has(mixId)) URL.revokeObjectURL(previewUrls.get(mixId));
      const previewUrl = URL.createObjectURL(blob);
      previewUrls.set(mixId, previewUrl);
      const currentCard = mixListEl.querySelector(`[data-mix="${mixId}"]`);
      currentCard.querySelector("[data-diy-preview-image]").src = previewUrl;
      currentCard.querySelector("[data-diy-preview]").hidden = false;
      currentCard.querySelector("[data-diy-empty]").hidden = true;
    }

    function loadImageElement(file) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        const objectUrl = URL.createObjectURL(file);
        image.onload = () => {
          URL.revokeObjectURL(objectUrl);
          resolve(image);
        };
        image.onerror = () => {
          URL.revokeObjectURL(objectUrl);
          reject(new Error("Image load failed"));
        };
        image.src = objectUrl;
      });
    }

    function canvasToBlob(canvas, quality) {
      return new Promise((resolve, reject) => {
        canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error("Image encode failed")), "image/jpeg", quality);
      });
    }

    async function prepareUploadImage(file) {
      if (!file?.type.startsWith("image/")) throw new Error("Invalid image");
      const image = await loadImageElement(file);
      const maxDimension = 1600;
      const scale = Math.min(1, maxDimension / Math.max(image.naturalWidth, image.naturalHeight));
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
      canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
      canvas.getContext("2d", { alpha: false }).drawImage(image, 0, 0, canvas.width, canvas.height);
      let blob = await canvasToBlob(canvas, 0.82);

      if (blob.size > 1600000) {
        const nextScale = Math.sqrt(1500000 / blob.size);
        const resized = document.createElement("canvas");
        resized.width = Math.max(1, Math.round(canvas.width * nextScale));
        resized.height = Math.max(1, Math.round(canvas.height * nextScale));
        resized.getContext("2d", { alpha: false }).drawImage(canvas, 0, 0, resized.width, resized.height);
        blob = await canvasToBlob(resized, 0.74);
      }
      return blob;
    }

    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result).split(",")[1] || "");
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(blob);
      });
    }

    async function handleDiyPhoto(mixId, file) {
      const card = mixListEl.querySelector(`[data-mix="${mixId}"]`);
      if (!card || !file) return;
      setDiyStatus(card, t("diySavedLocal"));
      try {
        const blob = await prepareUploadImage(file);
        await saveJourneyImage(mixId, blob);
        const progress = getMixProgress(mixId);
        progress.hasImage = true;
        progress.submitted = false;
        progress.submissionId = "";
        progress.submittedAt = "";
        saveJourney();
        await hydrateMixProgress(mixId);
        setDiyStatus(mixListEl.querySelector(`[data-mix="${mixId}"]`), t("diySavedLocal"));
      } catch {
        setDiyStatus(card, t("diyImageError"), "error");
      }
    }

    async function submitDiyVersion(mixId) {
      const card = mixListEl.querySelector(`[data-mix="${mixId}"]`);
      if (!card) return;
      const button = card.querySelector("[data-diy-submit]");
      const progress = getMixProgress(mixId);
      let imageBlob = null;
      try {
        imageBlob = await loadJourneyImage(mixId);
      } catch {
        imageBlob = imageCache.get(mixId) || null;
      }
      if (!imageBlob) {
        setDiyStatus(card, t("diyNeedPhoto"), "error");
        return;
      }

      button.disabled = true;
      button.textContent = t("diySubmitting");
      setDiyStatus(card, t("diySubmitting"));
      try {
        const mix = data.eventMixes.find((item) => item.id === mixId);
        const response = await fetch("/.netlify/functions/submit-recipe", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            clientId: journey.clientId,
            mixId,
            language: draft.lang || "zh",
            note: progress.note || "",
            assistantPrompt: assistantDrafts[mixId]?.prompt || "",
            formula: mix.formulas.zero[draft.lang || "zh"],
            imageMime: imageBlob.type || "image/jpeg",
            imageBase64: await blobToBase64(imageBlob)
          })
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok || !result.ok) throw new Error(result.error || "Submission failed");

        progress.submitted = true;
        progress.submissionId = result.submissionId || "";
        progress.submittedAt = new Date().toISOString();
        saveJourney();
        setDiyStatus(card, t("diySubmitted"), "success");
      } catch {
        setDiyStatus(card, t("diySubmitError"), "error");
      } finally {
        button.disabled = false;
        button.textContent = t("diySubmit");
      }
    }

    function renderAssistantModal() {
      if (!activeAssistantMixId) return;
      const mix = data.eventMixes.find((item) => item.id === activeAssistantMixId);
      if (!mix) return;
      const lang = draft.lang || "zh";
      const state = assistantDrafts[mix.id] || { prompt: "", generated: false };
      const prompts = lang === "zh" ? mix.assistantPromptsZh : mix.assistantPromptsEn;
      $("#assistantQuick").innerHTML = prompts.map((prompt) => `
        <button type="button" data-assistant-prompt="${prompt}">${prompt}</button>
      `).join("");
      assistantPromptEl.value = state.prompt || "";
      assistantStatusEl.textContent = "";
      assistantStatusEl.classList.remove("error");
      assistantGenerateEl.disabled = false;
      assistantGenerateEl.textContent = t("assistantGenerate");
      document.querySelector(".assistant-close").setAttribute("aria-label", t("assistantClose"));
      document.querySelector(".assistant-backdrop").setAttribute("aria-label", t("assistantClose"));

      if (!state.generated || !state.prompt) {
        assistantResultEl.hidden = true;
        assistantResultEl.innerHTML = "";
        return;
      }

      const reference = data.generateRecipeReference(mix, state.prompt, lang);
      assistantResultEl.innerHTML = `
        <p class="field-label">${t("assistantResult")}</p>
        <ul>${reference.formula.map((item) => `<li>${item}</li>`).join("")}</ul>
        <p class="assistant-note"><b>${t("assistantNote")}</b>${reference.note}</p>
      `;
      assistantResultEl.hidden = false;
    }

    function openAssistant(mixId) {
      activeAssistantMixId = mixId;
      assistantModalEl.hidden = false;
      assistantModalEl.setAttribute("aria-hidden", "false");
      document.body.classList.add("assistant-open");
      renderAssistantModal();
      window.requestAnimationFrame(() => assistantPromptEl.focus());
    }

    function closeAssistant() {
      assistantModalEl.hidden = true;
      assistantModalEl.setAttribute("aria-hidden", "true");
      document.body.classList.remove("assistant-open");
      activeAssistantMixId = "";
    }

    function generateAssistantReference() {
      const prompt = assistantPromptEl.value.trim();
      if (!prompt) {
        assistantStatusEl.textContent = t("assistantNeedPrompt");
        assistantStatusEl.classList.add("error");
        return;
      }

      assistantDrafts[activeAssistantMixId] = { prompt, generated: false };
      saveAssistantDrafts();
      assistantStatusEl.textContent = t("assistantGenerating");
      assistantStatusEl.classList.remove("error");
      assistantGenerateEl.disabled = true;
      assistantGenerateEl.textContent = t("assistantGenerating");

      window.setTimeout(() => {
        if (!activeAssistantMixId) return;
        assistantDrafts[activeAssistantMixId] = { prompt, generated: true };
        saveAssistantDrafts();
        renderAssistantModal();
      }, 420);
    }

    function renderCopy() {
      const lang = draft.lang || "zh";
      document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
      document.title = "prompt-order | AGI Bar";
      document.querySelectorAll("[data-i18n]").forEach((node) => {
        node.textContent = t(node.dataset.i18n);
      });
      document.querySelectorAll("[data-i18n-placeholder]").forEach((node) => {
        node.placeholder = t(node.dataset.i18nPlaceholder);
      });
      document.querySelectorAll("[data-lang]").forEach((button) => {
        button.classList.toggle("active", button.dataset.lang === lang);
      });
      document.querySelectorAll("[data-mode]").forEach((button) => {
        button.classList.toggle("active", button.dataset.mode === mode);
      });
      document.querySelectorAll(".mode-panel").forEach((panel) => {
        panel.classList.toggle("active", panel.id === `${mode}Panel`);
      });
      document.body.classList.toggle("lab-mode", mode === "lab");
      $("#page-title").classList.toggle("zh", lang === "zh");
      renderGroups();
      renderLab();
      if (activeAssistantMixId) renderAssistantModal();
    }

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.style.color = isError ? "var(--red)" : "var(--cyan)";
    }

    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add("show");
      window.setTimeout(() => toastEl.classList.remove("show"), 1600);
    }

    function setMode(nextMode) {
      if (!nextMode || mode === nextMode) return;
      mode = nextMode;
      const nextUrl = new URL(window.location.href);
      if (mode === "lab") {
        nextUrl.searchParams.set("tab", "lab");
        nextUrl.searchParams.set("mix", selectedMixId);
      }
      else {
        nextUrl.searchParams.delete("tab");
        nextUrl.searchParams.delete("mix");
      }
      window.history.replaceState(null, "", nextUrl);
      renderCopy();
    }

    function generate() {
      const prompt = promptEl.value.trim();
      if (!prompt && selected.size === 0) {
        setStatus(t("needInput"), true);
        return;
      }
      draft.prompt = promptEl.value;
      draft.selected = Array.from(selected);
      const drink = data.chooseDrink(draft);
      draft.currentDrinkId = drink.id;
      draft.lastDrinkId = drink.id;
      data.saveDraft(draft);
      window.location.href = "order.html";
    }

    function setLanguage(nextLang) {
      if (!nextLang || draft.lang === nextLang) return;
      draft.lang = nextLang;
      renderCopy();
      persist();
    }

    document.addEventListener("click", (event) => {
      const chip = event.target.closest("[data-chip]");
      if (!chip) return;
      const value = chip.dataset.chip;
      if (selected.has(value)) selected.delete(value);
      else selected.add(value);
      renderGroups();
      persist();
    });

    document.addEventListener("click", (event) => {
      const modeButton = event.target.closest("[data-mode]");
      if (!modeButton) return;
      setMode(modeButton.dataset.mode);
    });

    document.addEventListener("click", (event) => {
      const mixButton = event.target.closest("[data-mix-switch]");
      if (mixButton) {
        setActiveMix(mixButton.dataset.mixSwitch);
        return;
      }

      const submitButton = event.target.closest("[data-diy-submit]");
      if (submitButton) submitDiyVersion(submitButton.dataset.diySubmit);
    });

    document.addEventListener("change", (event) => {
      const photoInput = event.target.closest("[data-diy-photo]");
      if (!photoInput) return;
      handleDiyPhoto(photoInput.dataset.diyPhoto, photoInput.files?.[0]);
    });

    document.addEventListener("input", (event) => {
      const noteInput = event.target.closest("[data-diy-note]");
      if (!noteInput) return;
      const mixId = noteInput.dataset.diyNote;
      const progress = getMixProgress(mixId);
      progress.note = noteInput.value;
      progress.submitted = false;
      journey.activeMixId = mixId;
      saveJourney();
      setDiyStatus(mixListEl.querySelector(`[data-mix="${mixId}"]`), t("diySavedLocal"));
    });

    document.addEventListener("click", (event) => {
      const openButton = event.target.closest("[data-assistant-open]");
      if (openButton) {
        openAssistant(openButton.dataset.assistantOpen);
        return;
      }

      const promptButton = event.target.closest("[data-assistant-prompt]");
      if (promptButton) {
        const separator = draft.lang === "zh" ? "，" : ", ";
        const current = assistantPromptEl.value.trim();
        const nextPrompt = promptButton.dataset.assistantPrompt;
        assistantPromptEl.value = current ? `${current}${separator}${nextPrompt}` : nextPrompt;
        assistantDrafts[activeAssistantMixId] = { prompt: assistantPromptEl.value, generated: false };
        saveAssistantDrafts();
        assistantPromptEl.focus();
        return;
      }

      if (event.target.closest("[data-assistant-close]")) closeAssistant();
    });

    document.querySelector(".lang").addEventListener("pointerup", (event) => {
      const button = event.target.closest("[data-lang]");
      if (!button) return;
      event.preventDefault();
      setLanguage(button.dataset.lang);
    });

    document.querySelector(".lang").addEventListener("click", (event) => {
      const button = event.target.closest("[data-lang]");
      if (!button) return;
      setLanguage(button.dataset.lang);
    });

    $("#generate").addEventListener("click", generate);
    $("#assistantForm").addEventListener("submit", (event) => {
      event.preventDefault();
      generateAssistantReference();
    });
    assistantPromptEl.addEventListener("input", () => {
      if (!activeAssistantMixId) return;
      assistantDrafts[activeAssistantMixId] = { prompt: assistantPromptEl.value, generated: false };
      saveAssistantDrafts();
      assistantStatusEl.textContent = "";
      assistantStatusEl.classList.remove("error");
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !assistantModalEl.hidden) closeAssistant();
    });
    $("#clear").addEventListener("click", () => {
      selected.clear();
      promptEl.value = "";
      draft = { prompt: "", selected: [], lang: draft.lang || "zh", currentDrinkId: null, lastDrinkId: null };
      data.saveDraft(draft);
      setStatus("");
      renderCopy();
      showToast(t("clearSaved"));
    });
    promptEl.addEventListener("input", persist);

    promptEl.value = draft.prompt || "";
    renderCopy();
  </script>
</body>
</html>
